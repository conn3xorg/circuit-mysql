name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, ubuntu2404, debian13, debian12]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          # Conn3x has no Debian 12 test image, so that one lives here.
          CONTAINERFILE: ${{ github.workspace }}/${{ matrix.distro == 'debian12' && 'test/images' || 'conn3x/test/images' }}/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        env:
          TF_VAR_app_password: ci-only-password
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The example's secrets reach the host write-only, so state holds
      # none of them, and nothing Conn3x writes under .terraform does either.
      # .terraform/modules is left out: it holds downloaded module code.
      - name: Check the secrets stay out of state
        working-directory: examples/local
        run: |
          if grep -rqF --exclude-dir=modules -e ci-only-password terraform.tfstate .terraform/; then
            echo "A secret from the example is in terraform.tfstate or under .terraform/." >&2
            exit 1
          fi
      # app creates a table in its own database over TCP and reads it back,
      # is refused the database it has no grant on, and still finds its row
      # after MySQL restarts.
      - name: Log in as app, stay out of other, survive a restart
        run: |
          sudo podman exec -i -e MYSQL_PWD=ci-only-password circuit-mysql sh -eu <<'EOF'
          mysql -h 127.0.0.1 -u app app -e 'CREATE TABLE t (id INT); INSERT INTO t VALUES (1)'
          [ "$(mysql -h 127.0.0.1 -u app app -NBe 'SELECT id FROM t')" = 1 ]
          ! mysql -h 127.0.0.1 -u app other -e 'SELECT 1' || exit 1
          ! mysql -h 127.0.0.1 -u app -e 'CREATE TABLE other.t (id INT)' || exit 1
          systemctl restart mysql 2>/dev/null || systemctl restart mysqld
          [ "$(mysql -h 127.0.0.1 -u app app -NBe 'SELECT id FROM t')" = 1 ]
          [ "$(mysql -NBe 'SELECT @@max_connections')" = 50 ]
          EOF
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
